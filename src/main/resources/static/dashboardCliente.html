<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Seguradora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/menuCliente.css">
</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <h2>Seguradora</h2>
            <span>SEGUROS</span>
        </div>

        <nav class="menu">
            <a href="#">Dashboard</a>
            <a href="#">Minhas apolices</a>
            <a href="#">Meus Bens</a>
            <a href="#">Pagamentos</a>
            <a href="#">Sinisros</a>
            <a href="#">Contratações</a>
            <a href="#">Perfil</a>
            <a href="#">Suporte</a>
        </nav>

        <div class="sidebar-footer">
            <i class="fa-solid fa-circle-user"></i>
            <p>Usuário</p>
        </div>

    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

        <!-- TOPO -->
        <header class="topbar">

            <div>
                <h1>Dashboard</h1>
                <p>Painel do cliente</p>
            </div>

            <div class="user">
                Usuário
            </div>

        </header>

        <!-- GRID -->
        <section class="dashboard-grid">

            <!-- RESUMO -->
            <div class="box resumo">

                <div class="box-header">
                    <h2>Resumo</h2>
                </div>

                <div class="box-content">

                    <div class="mini-card"></div>

                    <div class="mini-card"></div>

                    <div class="mini-card"></div>

                    <div class="mini-card"></div>

                </div>

            </div>

            <!-- PAGAMENTOS -->
            <div class="box pagamentos">

                <div class="box-header">
                    <h2>Pagamentos</h2>
                </div>

                <div class="box-content">

                    <div class="item"></div>

                    <div class="item"></div>

                    <div class="item"></div>

                </div>

            </div>

            <!-- SINISTROS -->
            <div class="box sinistros">

                <div class="box-header">
                    <h2>Sinistros</h2>
                </div>

                <div class="box-content">

                    <div class="item large-item"></div>

                    <div class="item large-item"></div>

                </div>

            </div>

            <!-- HISTÓRICO -->
            <div class="box historico">

                <div class="box-header">
                    <h2>Histórico</h2>
                </div>

                <div class="box-content">

                    <div class="history-item"></div>

                    <div class="history-item"></div>

                    <div class="history-item"></div>

                    <div class="history-item"></div>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
