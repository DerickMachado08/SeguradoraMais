<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Cliente</title>

    <link rel="stylesheet" href="/cadastro.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- PAINEL ESQUERDO -->

    <aside class="left-panel">

        <h1>Seguradora+</h1>

        <p>
            Crie sua conta e tenha acesso completo ao sistema de seguros,
            gerenciamento de apólices e atendimento especializado.
        </p>

        <div class="divider"></div>

    </aside>

    <!-- PAINEL DIREITO -->

    <main class="right-panel">

        <div class="header-form">

            <h2>Cadastro de Cliente</h2>

            <span>
                Preencha os dados abaixo para criar sua conta.
            </span>

        </div>

        <form class="form-grid">

            <!-- DADOS PESSOAIS -->

            <h3 class="section-title">
                Dados Pessoais
            </h3>

            <div class="campo">
                <label>Nome Completo</label>

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="nome" placeholder="Digite seu nome completo">
                </div>

                <small id="nomeError"></small>
            </div>

            <div class="campo">
                <label>CPF</label>

                <div class="input-box">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>

                <small id="cpfError"></small>
            </div>

            <div class="campo">
                <label>Data de Nascimento</label>

                <div class="input-box">
                    <i class="fa-solid fa-calendar"></i>
                    <input type="date" id="dataNascimento">
                </div>

                <small id="idadeError"></small>
            </div>

            <div class="campo">
                <label>Email</label>

                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email"id="email" placeholder="Digite seu email">
                </div>

                <small id="emailError"></small>
            </div>

            <div class="campo">
                <label>Telefone</label>

                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                </div>

                <small id="telefoneError"></small>
            </div>

            <div class="campo">
                <label>Senha</label>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input type="password" id="senha" maxlength="26" placeholder="Digite sua senha">

                    <i class="fa-solid fa-eye olho"
                       onclick="olharSenha()"></i>
                </div>

                <small id="senhaError"></small>
            </div>

            <!-- ENDEREÇO -->

            <h3 class="section-title">
                Endereço
            </h3>

            <div class="campo">
                <label>CEP</label>

                <div class="input-box">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="cep" placeholder="00000-000">
                </div>

                <small id="cepError"></small>
            </div>

            <div class="campo campo-grande">
                <label>Logradouro</label>

                <div class="input-box">
                    <i class="fa-solid fa-road"></i>
                    <input type="text" id="logradouro" placeholder="Digite o logradouro">
                </div>

                <small id="logradouroError"></small>
            </div>

            <div class="campo">
                <label>Número</label>

                <div class="input-box">
                    <i class="fa-solid fa-hashtag"></i>
                    <input type="text" id="numero" placeholder="Número" oninput="this.value = this.value.replace(/\D/g, '')" maxlength="4">
                </div>

                <small id="numeroError"></small>
            </div>

            <div class="campo">
                <label>Bairro</label>

                <div class="input-box">
                    <i class="fa-solid fa-city"></i>
                    <input type="text" id="bairro" placeholder="Bairro">
                </div>

                <small id="bairroError"></small>
            </div>

            <div class="campo">
                <label>Cidade</label>

                <div class="input-box">
                    <i class="fa-solid fa-building"></i>
                    <input type="text" id="cidade" placeholder="Cidade">
                </div>

                <small id="cidadeError"></small>
            </div>

            <div class="campo">
                <label>Estado</label>

                <div class="input-box">
                    <i class="fa-solid fa-map"></i>
                    <input list="estados" id="estado" placeholder="UF">

                    <datalist id="estados">
                        <option value="AC">
                        <option value="AL">
                        <option value="AP">
                        <option value="AM">
                        <option value="BA">
                        <option value="CE">
                        <option value="DF">
                        <option value="ES">
                        <option value="GO">
                        <option value="MA">
                        <option value="MT">
                        <option value="MS">
                        <option value="MG">
                        <option value="PA">
                        <option value="PB">
                        <option value="PR">
                        <option value="PE">
                        <option value="PI">
                        <option value="RJ">
                        <option value="RN">
                        <option value="RS">
                        <option value="RO">
                        <option value="RR">
                        <option value="SC">
                        <option value="SP">
                        <option value="SE">
                        <option value="TO">
                    </datalist>

                </div>

                <small id="estadoError"></small>
            </div>

            <!-- AÇÕES -->

            <div class="actions">

                <a href="/publico/index.html" class="btn-voltar">
                    Voltar
                </a>

                <button type="button" class="btn-primary"
                        onclick="cadastrar()">
                    <i class="fa-solid fa-user-check"></i>
                    Criar Conta
                </button>

            </div>

        </form>

    </main>

</div>

<script src="../js/cadastro-cliente.js"></script>

</body>
</html>
