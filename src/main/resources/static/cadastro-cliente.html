<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Cliente</title>

    <link rel="stylesheet" href="/css/cadastro.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="left">
        <i class="fa-solid fa-shield-halved"></i>
        <h1>Seguradora<span> + </span></h1>
        <h2>Crie sua conta e comece a se proteger</h2>
        <p>Preencha seus dados para ter acesso completo ao sistema.</p>
    </div>

    <div class="right">

        <h2>Cadastro de Cliente</h2>

        <div class="grid">

            <div class="campo full">
                <label>Nome</label>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="nome">
                </div>
                <small id="nomeError"></small>
            </div>

            <div class="campo">
                <label>Email</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Digite seu email">
                </div>
                <small id="emailError"></small>
            </div>

            <div class="campo">
                <label>Telefone</label>
                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="telefone" placeholder="*(00) 00000-0000">
                </div>
            </div>

            <div class="campo">
                <label>CPF</label>
                <div class="input-box">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>
                <small id="cpfError"></small>
            </div>

            <div class="campo">
                <label>Data de Nascimento</label>
                <div class="input-box">
                    <i class="fa-solid fa-calendar"></i>
                    <input type="date" id="dataNascimento">
                </div>
                <small id="idadeError"></small>
            </div>

            <div class="campo">
                <label>Senha</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>
                <small id="senhaError"></small>
            </div>

            <h3 class="full">Endereço</h3>

            <div class="campo full">
                <label>Logradouro</label>
                <div class="input-box">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="logradouro">
                </div>
            </div>

            <div class="campo">
                <label>Número</label>
                <div class="input-box">
                    <i class="fa-solid fa-hashtag"></i>
                    <input type="text" id="numero">
                </div>
            </div>

            <div class="campo">
                <label>Bairro</label>
                <div class="input-box">
                    <i class="fa-solid fa-city"></i>
                    <input type="text" id="bairro">
                </div>
            </div>

            <div class="campo">
                <label>Cidade</label>
                <div class="input-box">
                    <i class="fa-solid fa-building"></i>
                    <input type="text" id="cidade">
                </div>
            </div>

            <div class="campo">
                <label>Estado</label>
                <div class="input-box">
                    <i class="fa-solid fa-map"></i>
                    <input list="estados" id="estado" placeholder="Estados">
                    <datalist id="estados">
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapa</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceara</option>
                        <option value="ES">Espirito Santo</option>
                        <option value="GO">Goias</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mata Grosso</option>
                        <option value="MS">Mata Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Para</option>
                        <option value="PB">Paraiba</option>
                        <option value="PR">Parana</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piaui</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondonia</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantis</option>
                    </datalist>
                </div>
            </div>

            <div class="campo">
                <label>CEP</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="text" id="cep">
                </div>
            </div>

            <button onclick="cadastrar()">Criar Conta</button>

            <p class="login-link">
                Já tem conta? <a href="/login.html">Fazer login</a>
            </p>

        </div>

    </div>
</div>

     <script src="./js/cadastro-cliente.js"></script>

</body>
</html>
