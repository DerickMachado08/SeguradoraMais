<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Cliente</title>

    <link rel="stylesheet" href="/css/cadastro.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="left">
        <i class="fa-solid fa-shield-halved"></i>
        <h1>Seguradora<span> + </span></h1>
        <h2>Crie sua conta e comece a se proteger</h2>
        <p>Preencha seus dados para ter acesso completo ao sistema.</p>
    </div>

    <div class="right">

        <h2>Cadastro de Cliente</h2>

        <div class="grid">

            <div class="campo full">
                <label>Nome</label>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="nome" placeholder="Digite seu nome completo">
                </div>
            </div>

            <div class="campo">
                <label>Email</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email">
                </div>
                <small id="emailError"></small>
            </div>

            <div class="campo">
                <label>Telefone</label>
                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="telefone">
                </div>
            </div>

            <div class="campo">
                <label>CPF</label>
                <div class="input-box">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="cpf">
                </div>
                <small id="cpfError"></small>
            </div>

            <div class="campo">
                <label>Data de Nascimento</label>
                <div class="input-box">
                    <i class="fa-solid fa-calendar"></i>
                    <input type="date" id="dataNascimento">
                </div>
                <small id="idadeError"></small>
            </div>

            <div class="campo">
                <label>Senha</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha">
                </div>
            </div>

            <h3 class="full">Endereço</h3>

            <div class="campo full">
                <label>Logradouro</label>
                <div class="input-box">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="logradouro">
                </div>
            </div>

            <div class="campo">
                <label>Número</label>
                <div class="input-box">
                    <i class="fa-solid fa-hashtag"></i>
                    <input type="text" id="numero">
                </div>
            </div>

            <div class="campo">
                <label>Bairro</label>
                <div class="input-box">
                    <i class="fa-solid fa-city"></i>
                    <input type="text" id="bairro">
                </div>
            </div>

            <div class="campo">
                <label>Cidade</label>
                <div class="input-box">
                    <i class="fa-solid fa-building"></i>
                    <input type="text" id="cidade">
                </div>
            </div>

            <div class="campo">
                <label>Estado</label>
                <div class="input-box">
                    <i class="fa-solid fa-map"></i>
                    <input type="text" id="estado">
                </div>
            </div>

            <div class="campo">
                <label>CEP</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="text" id="cep">
                </div>
            </div>

            <button onclick="cadastrar()">Criar Conta</button>

            <p class="login-link">
                Já tem conta? <a href="/login.html">Fazer login</a>
            </p>

        </div>

    </div>
</div>

     <script>
         function cadastrar(){
             fetch("http://localhost:8080/cliente",{
                 method: "POST", headers:{
                     "Content-Type": "application/json"
                 },
                 body: JSON.stringify({
                     nome: document.getElementById("nome").value,
                     email: document.getElementById("email").value,
                     cpf: document.getElementById("cpf").value,
                     senha: document.getElementById("senha").value,
                     dataNascimento: document.getElementById("dataNascimento").value,
                     telefone: document.getElementById("telefone").value,
                     logradouro: document.getElementById("logradouro").value,
                     numero: document.getElementById("numero").value,
                     bairro: document.getElementById("bairro").value,
                     cidade: document.getElementById("cidade").value,
                     estado: document.getElementById("estado").value,
                     cep: document.getElementById("cep").value
                 })
             })
                 .then(async res => {
                     if (!res.ok) {
                         // Se o status não for 2xx (ex: 400 Bad Request), pegamos o JSON de erro
                         const errorData = await res.json();
                         // Lançamos um erro com a mensagem que veio do Java ("CPF ja cadastrado", etc)
                         throw new Error(errorData.message);
                     }
                     return res.json(); // Se estiver OK, prossegue para o próximo .then
                 })
                 .then(() => {
                     alert("Cadastro realizado com sucesso!");
                     window.location.href = "/login.html";
                 })
                 .catch(error => {
                     // Aqui o 'error.message' será exatamente o texto que você enviou do Java
                     const msg = error.message;

                     // Limpa erros anteriores antes de mostrar os novos
                     document.getElementById("cpfError").innerText = "";
                     document.getElementById("emailError").innerText = "";
                     document.getElementById("idadeError").innerText = "";

                     if (msg.includes("CPF")) {
                         document.getElementById("cpfError").innerText = msg;
                     }
                     if (msg.includes("Email")) {
                         document.getElementById("emailError").innerText = msg;
                     }
                     if (msg.includes("menor")) {
                         document.getElementById("idadeError").innerText = msg;
                     }

                     console.error("Erro capturado:", msg);
                 });
         }
             // CPF
             const cpfInput = document.getElementById("cpf");
             cpfInput.addEventListener("input", () => {
                 let value = cpfInput.value.replace(/\D/g, "");

                 value = value.slice(0, 11);

                 value = value.replace(/(\d{3})(\d)/, "$1.$2");
                 value = value.replace(/(\d{3})(\d)/, "$1.$2");
                 value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

                 cpfInput.value = value;
             });

             // TELEFONE
             const telefoneInput = document.getElementById("telefone");
             telefoneInput.addEventListener("input", () => {
                 let value = telefoneInput.value.replace(/\D/g, "");

                 value = value.slice(0, 11);

                 value = value.replace(/^(\d{2})(\d)/g, "($1) $2");
                 value = value.replace(/(\d{5})(\d{4})$/, "$1-$2");

                 telefoneInput.value = value;
             });

     </script>

</body>
</html>
