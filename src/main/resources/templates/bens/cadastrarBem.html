<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Bem Patrimonial</title>
    <link rel="stylesheet" href="/css/main/app/menuCliente/patrimonialBem.css">
</head>
<body>

<header>
    <div class="header-user">
        <div class="avatar" th:text="${#strings.substring(cliente.nome, 0, 1)}">C</div>
        <span class="header-nome" th:text="${cliente.nome}">Cliente</span>
        <a href="/index.html" class="btn-logout">Sair</a>
    </div>
</header>

<main class="pagina-bem">
    <section class="cabecalho-bem">
        <a href="/cliente/contratar" class="link-voltar">Voltar</a>

        <h1>Dados do bem segurado</h1>
        <p>Complete os dados abaixo. A solicitacao so sera enviada ao corretor depois desse cadastro.</p>
    </section>

    <section class="resumo-contratacao">
        <h2>Resumo da solicitacao</h2>

        <div class="linha-resumo">
            <span>Seguro escolhido</span>
            <strong th:text="${contratacao.apolice.tipoApolice}">AUTO</strong>
        </div>

        <div class="linha-resumo">
            <span>Numero da apolice base</span>
            <strong th:text="${contratacao.apolice.numeroApolice}">AP20260001</strong>
        </div>

        <div class="linha-resumo">
            <span>Status</span>
            <strong th:text="${contratacao.status}">AGUARDANDO_BEM</strong>
        </div>
    </section>

    <div th:if="${erro != null}" class="alerta-erro" th:text="${erro}">
        Erro ao cadastrar bem.
    </div>

    <section class="formulario-bem">
        <form action="/cliente/contratacao/bem" method="post" id="formBem">
            <input type="hidden" name="idContratacao" th:value="${contratacao.id}">

            <div class="campo">
                <label for="tipoBem">Tipo do bem</label>
                <input id="tipoBem" type="text" name="tipoBem" th:value="${contratacao.apolice.tipoApolice}" readonly required>
            </div>

            <div class="campo">
                <label for="descricao">Descricao do bem</label>
                <textarea id="descricao" name="descricao" rows="5" placeholder="Informa os dados dos seus bem, sendo explicado de forma que o corretor avalia!" required></textarea>
            </div>

            <div class="campo">
                <label for="valorEstimado">Valor estimado (R$)</label>
                <input id="valorEstimado" name="valorEstimado" type="number" step="0.01" min="1" placeholder="" required>
            </div>

            <div class="campo">
                <label for="dataAquisicao">Data de aquisicao</label>
                <input id="dataAquisicao"
                       name="dataAquisicao"
                       type="date"
                       min="2018-01-01"
                       required>
            </div>

            <div class="acoes-formulario">
                <a href="/cliente/apolices" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-enviar">Enviar para analise</button>
            </div>
        </form>
    </section>
</main>

<script>
    document.getElementById("formBem").addEventListener("submit", function () {
        const botao = this.querySelector("button[type='submit']");
        botao.disabled = true;
        botao.textContent = "Enviando...";
    });

    const campoData = document.getElementById("dataAquisicao");

    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, "0");
    const dia = String(hoje.getDate()).padStart(2, "0");

    const dataHoje = `${ano}-${mes}-${dia}`;

    campoData.min = "2018-01-01";
    campoData.max = dataHoje;


    document.getElementById("formBem").addEventListener("submit", function () {
        const botao = this.querySelector("button[type='submit']");
        botao.disabled = true;
        botao.textContent = "Enviando...";
    });
</script>
</body>
</html>
