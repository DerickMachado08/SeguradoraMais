<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nova Senha</title>

    <link rel="stylesheet"
          href="/css/main/app/recuperarSenha.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Crie uma nova senha</h1>

        <p>
            Escolha uma senha segura para sua conta.
        </p>

        <div th:if="${erro}" class="mensagem erro">
            <span th:text="${erro}"></span>
        </div>

        <form action="/senha/alterar"
              method="post">

            <input
                    type="hidden"
                    name="email"
                    th:value="${email}"
            >

            <div class="campo">

                <label for="novaSenha">
                    Nova senha
                </label>

                <input
                        type="password"
                        id="novaSenha"
                        name="novaSenha"
                        placeholder="Digite sua nova senha"
                        required
                >

            </div>

            <div class="campo">

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Confirme sua nova senha"
                        required
                >

            </div>

            <button type="submit">
                Alterar senha
            </button>

        </form>

    </div>

</div>

</body>
</html>
